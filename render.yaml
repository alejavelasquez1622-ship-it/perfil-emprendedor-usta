services:
  - type: web
    name: perfil-emprendedor-usta
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/seed_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: INSTITUTION_NAME
        value: "Universidad Santo Tomás – Seccional Villavicencio"
      - key: DEPENDENCY_NAME
        value: "Dirección de Proyección Social"
